# Where to learn a skill: official docs first, then practice and courses. `skill` is a name from the
# skill taxonomy (a test checks it); every link was opened when this list was made and a test checks
# its shape. kind: docs | practice | course | roadmap | book. lang: uk | en.
version: 1
