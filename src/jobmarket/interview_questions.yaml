# Interview practice: short questions and model answers, five per skill. `skill` is a name from the
# skill taxonomy (a test checks it). Answers are a reminder of the idea, not a full lecture:
# learn from them, then say it in your own words.
version: 1
questions:
  # ---- Python
  - {id: python-01, skill: Python, level: junior, question: "Чим відрізняються list і tuple?", answer: "list змінний (mutable), tuple незмінний. Tuple можна використати як ключ словника (якщо елементи hashable), він трохи легший і швидше створюється. List беруть, коли колекція змінюється, tuple для фіксованих записів на кшталт координат."}
  - {id: python-02, skill: Python, level: junior, question: "Чому `def f(x=[])` небезпечне?", answer: "Значення за замовчуванням обчислюється один раз, коли функцію визначають, тому цей список спільний між усіма викликами й накопичує зміни. Правильно: `def f(x=None)` і всередині `x = [] if x is None else x`."}
  - {id: python-03, skill: Python, level: middle, question: "Що таке GIL і що він означає для потоків?", answer: "Global Interpreter Lock у CPython дозволяє виконувати Python-байткод лише одному потоку одночасно. Для задач, що вантажать CPU, потоки не прискорюють (беруть multiprocessing); для I/O потоки й asyncio працюють добре, бо GIL відпускається під час очікування. У Python 3.13 є експериментальна збірка без GIL (PEP 703)."}
  - {id: python-04, skill: Python, level: middle, question: "Чим `is` відрізняється від `==`?", answer: "`==` порівнює значення (викликає __eq__), `is` перевіряє ідентичність: це той самий об'єкт у пам'яті. `is` доречний для None, True, False. Не покладайтеся на `is` для чисел і рядків: інтернування є деталлю реалізації."}
  - {id: python-05, skill: Python, level: senior, question: "Що таке генератор і коли він кращий за список?", answer: "Функція з yield (або generator expression) повертає ліниву послідовність: значення рахуються по одному, пам'ять O(1). Кращий для великих чи нескінченних потоків і конвеєрів обробки. Недолік: один прохід, немає len() та індексації."}
  # ---- SQL
  - {id: sql-01, skill: SQL, level: junior, question: "Чим INNER JOIN відрізняється від LEFT JOIN?", answer: "INNER JOIN повертає лише рядки, що мають збіг в обох таблицях. LEFT JOIN повертає всі рядки лівої таблиці, а де збігу немає, колонки правої дорівнюють NULL."}
  - {id: sql-02, skill: SQL, level: junior, question: "Чим WHERE відрізняється від HAVING?", answer: "WHERE фільтрує рядки до групування, HAVING фільтрує групи після GROUP BY і може використовувати агрегати, наприклад HAVING count(*) > 5."}
  - {id: sql-03, skill: SQL, level: middle, question: "Що таке індекс і яка ціна його використання?", answer: "Це структура (найчастіше B-tree), що прискорює пошук, сортування й JOIN по колонці. Ціна: місце на диску й повільніші INSERT, UPDATE, DELETE. Індекс не допоможе, якщо умова обгортає колонку функцією або запит читає більшу частину таблиці."}
  - {id: sql-04, skill: SQL, level: middle, question: "Навіщо потрібні віконні функції (window functions)?", answer: "Вони рахують значення по «вікну» рядків і не згортають результат: ROW_NUMBER, RANK, LAG, LEAD, SUM() OVER (PARTITION BY ... ORDER BY ...). Типові задачі: топ-N у групі, наростаючий підсумок, різниця з попереднім рядком."}
  - {id: sql-05, skill: SQL, level: senior, question: "Як читати план виконання запиту?", answer: "Дивитися на тип доступу (послідовне сканування чи індекс), порівнювати оцінку з фактом (EXPLAIN ANALYZE), тип і порядок JOIN, великі сортування на диску. Велика розбіжність оцінки й факту зазвичай означає застарілу статистику."}
  # ---- Git
  - {id: git-01, skill: Git, level: junior, question: "Чим merge відрізняється від rebase?", answer: "merge об'єднує гілки і зберігає історію разом із merge-комітом. rebase переписує коміти поверх нової бази: історія лінійна, але хеші змінюються, тому не можна робити rebase вже опублікованих спільних гілок."}
  - {id: git-02, skill: Git, level: junior, question: "Як скасувати останній коміт, який уже запушено?", answer: "`git revert <хеш>` створює новий коміт, що скасовує зміни: це безпечно для спільної гілки. `reset --hard` із force push переписує історію, його можна лише на власних гілках."}
  - {id: git-03, skill: Git, level: middle, question: "Що робить `git stash`?", answer: "Тимчасово прибирає незакомічені зміни, щоб перемкнути гілку з чистим деревом. `git stash pop` повертає їх. Корисно, коли треба терміново переключитись, не коміттячи напівготову роботу."}
  - {id: git-04, skill: Git, level: middle, question: "Чим `git fetch` відрізняється від `git pull`?", answer: "fetch завантажує нові коміти й оновлює віддалені гілки, не чіпаючи вашу робочу гілку. pull це fetch плюс merge (або rebase, якщо так налаштовано)."}
  - {id: git-05, skill: Git, level: senior, question: "Як знайти коміт, що зламав поведінку?", answer: "`git bisect`: ви позначаєте «поганий» і «добрий» коміти, Git бінарним пошуком пропонує проміжні. Можна автоматизувати: `git bisect run <команда>`, що повертає 0 для доброго коміта."}
  # ---- Docker
  - {id: docker-01, skill: Docker, level: junior, question: "Чим образ (image) відрізняється від контейнера?", answer: "Образ це незмінний шаблон: файлова система й метадані. Контейнер це запущений екземпляр образу з тонким записуваним шаром зверху. З одного образу запускають багато контейнерів."}
  - {id: docker-02, skill: Docker, level: junior, question: "Чим CMD відрізняється від ENTRYPOINT?", answer: "ENTRYPOINT задає програму, яка запускається завжди. CMD задає команду або аргументи за замовчуванням, які можна перевизначити в `docker run`. Разом: ENTRYPOINT це програма, CMD її типові аргументи."}
  - {id: docker-03, skill: Docker, level: middle, question: "Як зменшити образ і прискорити збірку?", answer: "Менший базовий образ (slim), multi-stage збірка, правильний порядок шарів (спершу залежності, потім код: так працює кеш), .dockerignore, без кешів менеджера пакетів у фінальному шарі."}
  - {id: docker-04, skill: Docker, level: middle, question: "Де зберігати дані контейнера?", answer: "У volume (керується Docker) або bind mount. Файли, записані в шар контейнера, зникають разом із ним. База даних у контейнері без volume втратить дані при видаленні контейнера."}
  - {id: docker-05, skill: Docker, level: senior, question: "Які правила безпеки для контейнерів?", answer: "Не запускати процес від root (USER), мінімальний образ, не класти секрети в образ чи ENV-шар, файлова система лише для читання де можна, фіксовані версії або дайджести базових образів, сканування образів на вразливості."}
  # ---- REST
  - {id: rest-01, skill: REST, level: junior, question: "Що таке REST і які основні HTTP-методи?", answer: "Стиль API поверх HTTP: ресурси мають URL. GET читає, POST створює, PUT замінює повністю, PATCH змінює частково, DELETE видаляє. Сервер не зберігає стан клієнта між запитами (stateless)."}
  - {id: rest-02, skill: REST, level: junior, question: "Що означають групи кодів відповіді HTTP?", answer: "2xx успіх (200, 201 створено, 204 без тіла), 3xx перенаправлення, 4xx помилка клієнта (400, 401 не автентифіковано, 403 заборонено, 404, 409 конфлікт, 429 забагато запитів), 5xx помилка сервера."}
  - {id: rest-03, skill: REST, level: middle, question: "Що таке ідемпотентність методу?", answer: "Повторення запиту дає той самий стан сервера, що й один виклик. GET, PUT і DELETE ідемпотентні, POST ні. Тому для платежів і подібного вводять idempotency key, щоб повтор не створив дубль."}
  - {id: rest-04, skill: REST, level: middle, question: "Як зробити пагінацію?", answer: "offset/limit простий, але повільний на великих зсувах і «пливе», якщо дані змінюються. Cursor (keyset) пагінація за останнім ключем стабільна й швидка. У відповіді повертають посилання або курсор на наступну сторінку."}
  - {id: rest-05, skill: REST, level: senior, question: "Як версіонувати API, не ламаючи клієнтів?", answer: "Версія в URL (/v1) або заголовку. Додавати поля сумісно (клієнти ігнорують невідоме), не видаляти й не перейменовувати без нової версії, оголошувати застарівання (deprecation) із терміном."}
  # ---- CI/CD
  - {id: cicd-01, skill: CI/CD, level: junior, question: "Чим CI відрізняється від CD?", answer: "CI (continuous integration) це часті автоматичні збірка й тести кожної зміни. Continuous delivery: артефакт завжди готовий до релізу (деплой за кнопкою). Continuous deployment: автоматичний деплой у прод після проходження перевірок."}
  - {id: cicd-02, skill: CI/CD, level: junior, question: "Що буває в типовому pipeline?", answer: "checkout, встановлення залежностей (з кешем), лінтер і типи, тести, збірка артефакту чи образу, публікація, деплой. Швидкі перевірки йдуть першими, pipeline падає на першій помилці."}
  - {id: cicd-03, skill: CI/CD, level: middle, question: "Як прискорити pipeline?", answer: "Кеш залежностей, паралельні джоби, запуск лише змінених частин, швидкі перевірки першими, розбиття тестів на частини (sharding), менші образи."}
  - {id: cicd-04, skill: CI/CD, level: middle, question: "Які бувають стратегії деплою?", answer: "Rolling (поступова заміна), blue-green (два середовища, перемикання трафіку), canary (частка трафіку на нову версію). Feature flags відокремлюють розгортання коду від увімкнення функції."}
  - {id: cicd-05, skill: CI/CD, level: senior, question: "Як безпечно працювати із секретами в CI?", answer: "Зберігати в secret-сховищі CI, не в репозиторії. Мінімальні права, короткоживучі токени (OIDC замість довгих ключів), маскування в логах, обмеження для pull request із форків."}
  # ---- PostgreSQL
  - {id: postgres-01, skill: PostgreSQL, level: junior, question: "Що таке первинний і зовнішній ключ?", answer: "Первинний ключ унікально ідентифікує рядок (NOT NULL і UNIQUE). Зовнішній ключ посилається на первинний іншої таблиці й забезпечує цілісність: не дає створити «сироту» або видалити рядок, на який ще посилаються (залежно від ON DELETE)."}
  - {id: postgres-02, skill: PostgreSQL, level: junior, question: "Що таке транзакція та ACID?", answer: "Транзакція це група операцій «все або нічого». ACID: Atomicity (атомарність), Consistency (узгодженість), Isolation (ізоляція), Durability (збереженість після коміту)."}
  - {id: postgres-03, skill: PostgreSQL, level: middle, question: "Що таке MVCC і навіщо VACUUM?", answer: "MVCC: кожна транзакція бачить знімок даних, UPDATE створює нову версію рядка, стара лишається «мертвою». VACUUM прибирає мертві версії й звільняє місце для повторного використання; autovacuum робить це автоматично."}
  - {id: postgres-04, skill: PostgreSQL, level: middle, question: "Які рівні ізоляції є в PostgreSQL?", answer: "Read Committed (за замовчуванням), Repeatable Read і Serializable (Read Uncommitted поводиться як Read Committed). Вищі рівні захищають від більшої кількості аномалій, але можливі помилки серіалізації, і транзакцію треба повторити."}
  - {id: postgres-05, skill: PostgreSQL, level: senior, question: "Як діагностувати повільний запит?", answer: "EXPLAIN (ANALYZE, BUFFERS) для плану, pg_stat_statements для найважчих запитів, перевірити індекси та статистику (ANALYZE), блокування (pg_locks), налаштування на кшталт work_mem і роздування таблиць (bloat)."}
  # ---- JavaScript
  - {id: js-01, skill: JavaScript, level: junior, question: "Чим відрізняються var, let і const?", answer: "var має функціональну область видимості й піднімається (hoisting). let і const мають блокову. const забороняє перепризначення змінної, але не змінює вміст об'єкта."}
  - {id: js-02, skill: JavaScript, level: junior, question: "Чим `==` відрізняється від `===`?", answer: "`==` приводить типи перед порівнянням (`0 == '0'` дає true), `===` порівнює без приведення. Зазвичай використовують `===`."}
  - {id: js-03, skill: JavaScript, level: middle, question: "Що таке замикання (closure)?", answer: "Функція зберігає доступ до змінних зовнішньої області видимості, навіть коли зовнішня функція вже завершилась. Застосування: лічильники, приватний стан, фабрики функцій, колбеки."}
  - {id: js-04, skill: JavaScript, level: middle, question: "Як працює event loop: Promise проти setTimeout?", answer: "JavaScript виконується в одному потоці зі стеком викликів і чергами. Мікрозадачі (Promise.then) виконуються після поточного стеку, перед макрозадачами (setTimeout, події). Тому `Promise.resolve().then(f)` спрацює раніше за `setTimeout(f, 0)`."}
  - {id: js-05, skill: JavaScript, level: senior, question: "Як визначається значення `this`?", answer: "За способом виклику: метод об'єкта має цей об'єкт; звичайний виклик у strict mode дає undefined; call, apply, bind задають явно; стрілкова функція бере this із лексичного оточення; `new` створює новий об'єкт."}
  # ---- TypeScript
  - {id: ts-01, skill: TypeScript, level: junior, question: "Навіщо потрібен TypeScript?", answer: "Це статична типізація поверх JavaScript: помилки типів виявляються до запуску, краще автодоповнення й безпечніший рефакторинг. Типи стираються при компіляції, у рантаймі це звичайний JS."}
  - {id: ts-02, skill: TypeScript, level: junior, question: "Чим `interface` відрізняється від `type`?", answer: "Обидва описують форму об'єкта. interface можна розширювати (extends) і доповнювати (declaration merging). type вміє об'єднання (union), перетини й умовні типи."}
  - {id: ts-03, skill: TypeScript, level: middle, question: "Що таке union-тип і звуження (narrowing)?", answer: "Тип `A | B` приймає значення одного з типів. Звуження це уточнення перевіркою: typeof, in, дискримінантне поле, власний type guard. Після перевірки компілятор знає точний тип у гілці."}
  - {id: ts-04, skill: TypeScript, level: middle, question: "Чим any, unknown і never відрізняються?", answer: "any вимикає перевірку типів. unknown це безпечний «будь-який»: перед використанням треба звузити. never це значення, якого не існує (функція, що завжди кидає помилку, або вичерпана перевірка union)."}
  - {id: ts-05, skill: TypeScript, level: senior, question: "Що таке generics і навіщо обмеження `extends`?", answer: "Параметризовані типи для повторного використання зі збереженням типобезпеки: `function first<T>(a: T[]): T`. Обмеження `T extends { id: string }` гарантує, що в T є потрібні властивості."}
  # ---- Linux
  - {id: linux-01, skill: Linux, level: junior, question: "Що означає `chmod 755`?", answer: "Власник має rwx (7), група r-x (5), інші r-x (5): власник читає, пише й виконує, решта читає й виконує."}
  - {id: linux-02, skill: Linux, level: junior, question: "Як знайти процес і зупинити його?", answer: "`ps aux | grep імя`, `top` або `htop`; `kill PID` надсилає SIGTERM (ввічливе завершення), `kill -9 PID` SIGKILL (примусово, лише коли інакше не виходить)."}
  - {id: linux-03, skill: Linux, level: middle, question: "Як побачити, який процес слухає порт?", answer: "`ss -ltnp` показує TCP-порти, що слухають, і процес. Альтернативи: `lsof -i :8080`, старіший `netstat -tlnp`."}
  - {id: linux-04, skill: Linux, level: middle, question: "Чим hard link відрізняється від symbolic link?", answer: "Hard link це ще одне ім'я того самого inode (в межах однієї файлової системи, не для каталогів). Symlink це окремий файл із шляхом: може «зламатись» і працює між файловими системами."}
  - {id: linux-05, skill: Linux, level: senior, question: "Сервер повільний: з чого почати діагностику?", answer: "uptime і load average, `top` (CPU, пам'ять, swap), `vmstat` та `iostat` (диск, черги), `df -h` і `df -i` (місце та inode), `dmesg` або journalctl (OOM killer, помилки), `ss` для мережі. Мета знайти вузьке місце: CPU, пам'ять, диск чи мережа."}
  # ---- AWS
  - {id: aws-01, skill: AWS, level: junior, question: "Чим EC2 відрізняється від Lambda?", answer: "EC2 це віртуальні машини: ви керуєте ОС і масштабуванням, платите за час роботи. Lambda запускає функції за подіями без серверів, платите за виклики й тривалість; є ліміт часу (15 хвилин) і холодний старт."}
  - {id: aws-02, skill: AWS, level: junior, question: "Що таке S3 і для чого його використовують?", answer: "Об'єктне сховище: бакети й об'єкти за ключем, висока довговічність, класи зберігання, версіонування, правила життєвого циклу. Це не файлова система: немає справжніх каталогів і часткового оновлення об'єкта."}
  - {id: aws-03, skill: AWS, level: middle, question: "Що таке IAM: користувач, роль, політика?", answer: "Політика це документ із правами. Користувач це довгоживуча ідентичність. Роль дає тимчасові облікові дані, які «одягає» сервіс або користувач: краще, ніж довгі ключі. Принцип найменших привілеїв."}
  - {id: aws-04, skill: AWS, level: middle, question: "Що таке VPC, публічна й приватна підмережа?", answer: "VPC це ізольована віртуальна мережа. Публічна підмережа має маршрут до Internet Gateway. Приватна виходить назовні через NAT Gateway; бази даних тримають у приватних."}
  - {id: aws-05, skill: AWS, level: senior, question: "Як зробити сервіс відмовостійким в AWS?", answer: "Кілька зон доступності (AZ), балансувальник (ALB), Auto Scaling, керовані БД із multi-AZ чи репліками, резервні копії, health checks, сервіс без стану на інстансі (stateless), моніторинг і алерти (CloudWatch), тест відмов."}
  # ---- Kubernetes
  - {id: k8s-01, skill: Kubernetes, level: junior, question: "Що таке Pod, Deployment і Service?", answer: "Pod це найменша одиниця запуску (один чи кілька контейнерів). Deployment декларативно керує репліками Pod і оновленнями. Service це стабільна адреса й балансування на набір Pod за селектором."}
  - {id: k8s-02, skill: Kubernetes, level: junior, question: "Які команди kubectl допомагають діагностувати Pod?", answer: "`kubectl get pods`, `describe pod` (події: чому не стартує), `logs` (логи контейнера), `exec` (зайти всередину), `get events`."}
  - {id: k8s-03, skill: Kubernetes, level: middle, question: "Чим liveness відрізняється від readiness probe?", answer: "liveness відповідає, чи перезапускати контейнер. readiness відповідає, чи слати на нього трафік: поки не готовий, Pod прибирають із Service. startupProbe дає час повільному старту."}
  - {id: k8s-04, skill: Kubernetes, level: middle, question: "Що таке requests і limits?", answer: "requests це скільки ресурсів резервує й враховує планувальник. limits це верхня межа: CPU тротлиться, а перевищення пам'яті закінчується OOMKill контейнера."}
  - {id: k8s-05, skill: Kubernetes, level: senior, question: "Як відбувається rolling update і відкат?", answer: "Deployment поступово замінює Pod (maxSurge, maxUnavailable), перевіряючи readiness. Стан дивляться `kubectl rollout status`, відкочують `kubectl rollout undo`; історія ревізій зберігається."}
