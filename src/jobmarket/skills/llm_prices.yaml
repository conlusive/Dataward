# USD per 1,000,000 tokens, used only to estimate and log the cost of extraction runs.
# Prices change: check the provider's page and edit this file. A model that is not listed (or a
# local Ollama model) costs 0 in the logs and the run says so.
#
# Gemini: checked on 2026-11-09 against Google's pricing page (Standard tier, text input; the output
# price includes the model's thinking tokens). gemini-3.6-flash and gemini-3.8-flash cost twice as
# much from 2027-01-01 and are left out; gemini-2.5-flash is deprecated and left out; gemini-2.0-flash
# is no longer listed. Availability is not the same as being listed: on 2026-11-09 a new key got
# HTTP 404 for gemini-2.5-flash-lite ("no longer available to new users") and worked with
# gemini-3.5-flash-lite, so prefer that one.
# OpenAI: gpt-4o-mini is NOT verified; the numbers are the ones I knew and may be out of date.
models:
  gpt-4o-mini: {input: 0.15, output: 0.60}
  gemini-2.5-flash-lite: {input: 0.10, output: 0.40}
  gemini-3.1-flash-lite: {input: 0.25, output: 1.50}
  gemini-3.5-flash-lite: {input: 0.30, output: 2.50}
  gemini-3-flash-preview: {input: 0.50, output: 3.00}
