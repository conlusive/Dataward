# Skill taxonomy v1 for the dictionary extractor (method A).
#
# id          slug, the stable key stored in silver_vacancy_skills
# name        canonical display name
# category    one of `categories` below
# aliases     other spellings, matched case-insensitively as whole words
# parent      id of a broader skill (roll-ups in gold)
# strict      true = the word is also plain English/Ukrainian ("Go", "R", "Spring"); it counts only
#             when written exactly as in `case` (default: the name) AND one of `context` words is
#             within 80 characters
# case        exact spelling a strict skill must have (default: name)
#
# Add a skill by appending a line; `make test` validates unique ids/aliases, parents, categories.
categories:
  - language
  - backend
  - frontend
  - mobile
  - database
  - data
  - ml
  - cloud
  - devops
  - testing
  - security
  - network
  - embedded
  - tool
  - methodology
  - platform
  - game

