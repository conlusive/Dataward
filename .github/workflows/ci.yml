name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group dashboard --group ml
      - run: make lint
      - run: make test

  # The image must build and be able to start the CLI and dbt; nothing is pushed anywhere.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.pipeline -t jobmarket-pipeline .
      - name: The CLI starts
        run: docker run --rm jobmarket-pipeline jobmarket --help
      - name: dbt reads the project
        run: >
          docker run --rm -e DUCKDB_PATH=/tmp/check.duckdb jobmarket-pipeline
          dbt parse --project-dir warehouse --profiles-dir warehouse
      - name: The flow refuses an unknown step
        run: |
          set +e
          docker run --rm jobmarket-pipeline jobmarket flow daily --only nope
          test $? -eq 2

  # The dashboard image must build and serve its health endpoint (without any data it shows a message).
  dashboard-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.dashboard -t jobmarket-dashboard .
      - name: The server answers
        run: |
          docker run -d --name dashboard -p 8501:8501 jobmarket-dashboard
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs dashboard
          exit 1

  # Tell the host to deploy this commit. Render's own auto-deploy has missed merges; a deploy hook
  # does not depend on it. Optional: without the secret RENDER_DEPLOY_HOOK_URL the job does nothing.
  deploy:
    needs: [checks, dashboard-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Ask Render to deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "no RENDER_DEPLOY_HOOK_URL secret: relying on the host's auto-deploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null && echo "deploy requested"
