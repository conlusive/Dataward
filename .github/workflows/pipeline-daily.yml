name: pipeline-daily

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC
  workflow_dispatch:
    inputs:
      run_date:
        description: "YYYY-MM-DD (empty = today, UTC)"
        required: false
        default: ""
      max_pages:
        description: "Cap listing pages per category (empty = no cap; use 1 for a smoke run)"
        required: false
        default: ""

permissions:
  contents: read

# Two runs writing the same bronze partitions would race; queue instead of cancelling.
concurrency:
  group: pipeline-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUN_DATE: ${{ inputs.run_date }}
      SCRAPE_MAX_LIST_PAGES: ${{ inputs.max_pages }}
      SCRAPE_USER_AGENT: "jobmarket-research-bot (+https://github.com/${{ github.repository }})"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Interim bronze storage until STORAGE_URI=s3:// (R2) lands in phase 5: a rolling cache.
      # Each run restores the newest copy and saves a new one, so history survives as long as
      # the pipeline keeps running daily. It is NOT durable storage.
      - name: Restore bronze
        uses: actions/cache/restore@v4
        with:
          path: |
            data/bronze
            data/jobmarket.duckdb
          key: bronze-restore-${{ github.run_id }}
          restore-keys: bronze-

      - run: uv sync --frozen

      # One command runs the whole flow: scrape, survey, parse, silver checks, dbt, gold checks,
      # export. Each step has its own timeout and retries, a failed step skips the steps that need
      # it (bad silver data never reaches gold), and every attempt is a row in `ops_task_runs`.
      # The Telegram secrets are optional: without them no message is sent.
      - name: Run the pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: make pipeline

      # Save even when a step failed: what was scraped and parsed is still valid.
      - name: Save bronze and silver
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/bronze
            data/jobmarket.duckdb
          key: bronze-${{ github.run_id }}-${{ github.run_attempt }}-silver

      - name: Run metrics
        if: always()
        run: |
          uv run python - <<'EOF'
          import duckdb
          con = duckdb.connect("data/jobmarket.duckdb", read_only=True)
          rows = con.execute(
              "SELECT run_id, status, pages, new_pages, skipped_pages, errors, http_429, http_403 "
              "FROM ops_scrape_runs ORDER BY started_at DESC LIMIT 12"
          ).fetchall()
          for row in rows:
              print(row)
          EOF

      # Parquet for the dashboards, kept as a run artifact until the publishing target exists.
      - name: Upload gold export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-export
          path: data/export
          retention-days: 14
          if-no-files-found: ignore
