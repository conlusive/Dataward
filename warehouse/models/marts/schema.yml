version: 2

models:
  - name: fct_vacancy_daily
    description: One row per vacancy and day while the vacancy is open (see the model for the rules).
    columns:
      - name: vacancy_day_key
        data_tests: [unique, not_null]
      - name: date
        data_tests: [not_null]
      - name: vacancy_id
        data_tests: [not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [new, active, closed]
      - name: lifetime_days
        data_tests: [not_null]
