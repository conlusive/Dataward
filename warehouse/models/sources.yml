version: 2

# Tables written by the Python pipeline (jobmarket parse). dbt reads them, never writes them.
sources:
  - name: silver
    schema: main
    tables:
      - name: silver_vacancies
        columns:
          - name: id
            data_tests: [unique, not_null]
          - name: source
            data_tests:
              - accepted_values:
                  arguments:
                    values: [dou, djinni]
          - name: title
            data_tests: [not_null]
          - name: content_hash
            data_tests: [not_null]

      - name: silver_vacancy_sightings
        description: >
          Which vacancies were listed on which day, read from the stored listing pages. A vacancy
          missing for two days is treated as closed.
        columns:
          - name: vacancy_id
            data_tests: [not_null]
          - name: seen_date
            data_tests: [not_null]

      - name: silver_skills
        columns:
          - name: skill_id
            data_tests: [unique, not_null]
          - name: parent_id
            data_tests:
              - relationships:
                  arguments:
                    to: source('silver', 'silver_skills')
                    field: skill_id

      - name: silver_vacancy_skills
        columns:
          - name: vacancy_id
            data_tests: [not_null]
          - name: skill_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('silver', 'silver_skills')
                    field: skill_id

      - name: silver_vacancy_groups
        columns:
          - name: dedup_group_id
            data_tests: [unique, not_null]

      - name: silver_dou_salaries
        description: >
          DOU survey answers. A position or city missing from the seeds (position_map, city_map) is only
          a warning: regenerate the seeds with `jobmarket make-seeds` after loading new waves.
        columns:
          - name: position
            data_tests:
              - relationships:
                  arguments:
                    to: ref('position_map')
                    field: position_raw
                  config:
                    severity: warn
          - name: city
            data_tests:
              - relationships:
                  arguments:
                    to: ref('city_map')
                    field: city_raw
                  config:
                    severity: warn
