  # --- split-out concepts that used to be noise
  - {text: "Strong debugging and profiling skills", required: []}
  - {text: "Terraform and Infrastructure as Code", required: [iac, terraform]}
  - {text: "Using Claude Code, Cursor and GitHub Copilot daily", required: [ai-coding-tools]}
