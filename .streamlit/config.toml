# The dashboard's look (read when `streamlit run` starts in the repository root; the dashboard image
# copies this file too). "Soft signal": GitHub's dark surface, powder, lavender and violet, a heavy grotesque. The chart
# colours were checked with the dataviz palette validator on the white card.
[theme]
base = "dark"
primaryColor = "#A78BFA"
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
borderColor = "#30363D"
dataframeBorderColor = "#30363D"
dataframeHeaderBackgroundColor = "#161B22"
linkColor = "#A78BFA"
greenColor = "#3FB950"
orangeColor = "#D29922"
redColor = "#F85149"
blueColor = "#58A6FF"
baseRadius = "large"
buttonRadius = "full"
showSidebarBorder = false
# One grotesque for everything, heavy in titles. Cyrillic is required (the UI is Ukrainian): both have it. If
# the font host is not reachable the browser falls back to its own serif and sans fonts.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
codeFont = "JetBrains Mono, ui-monospace, monospace"
headingFontWeights = [800, 800, 700, 700, 700, 700]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 600
chartCategoricalColors = ["#7A5AE0", "#2E8FD0", "#C08A10", "#DB5F93"]

[server]
# dashboard/static (the logo and the tab icons) is served at /app/static, see dashboard_icon.py
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
