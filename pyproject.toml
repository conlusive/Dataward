[project]
name = "jobmarket"
version = "0.1.0"
description = "Reproducible, observable data pipeline for the Ukrainian IT job market (medallion: bronze/silver/gold)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "selectolax>=1.0.2",
    "tenacity>=9.2.1",
]

[project.scripts]
jobmarket = "jobmarket.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobmarket"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not llm'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "llm: tests that call a real LLM; run locally only, skipped in CI",
]
