[project]
name = "jobmarket"
version = "0.2.1"
description = "Reproducible, observable data pipeline for the Ukrainian IT job market (medallion: bronze/silver/gold)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "networkx>=3.6.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.2",
    "tenacity>=9.2.1",
]

[project.scripts]
jobmarket = "jobmarket.cli:main"

[dependency-groups]
dashboard = [
    "streamlit>=1.67.0",
]
dev = [
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mypy>=1.10",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=5.0",
    "pyyaml>=6.0.3",
    "ruff>=0.5",
    "types-pyyaml>=6.0.12.20261103",
]
ml = [
    "alembic>=1.20.1",
    "catboost>=1.2.10",
    "mlflow-skinny>=3.18.0",
    "sqlalchemy>=2.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobmarket"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]  # SQL strings and printed tables read better unwrapped

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not llm'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "llm: tests that call a real LLM; run locally only, skipped in CI",
]

[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true  # networkx ships no type information

[[tool.mypy.overrides]]
module = ["pandas.*", "streamlit.*", "altair.*"]
ignore_missing_imports = true  # optional dashboard group; pandas is typed loosely on purpose

[[tool.mypy.overrides]]
module = ["catboost.*", "mlflow.*"]
ignore_missing_imports = true  # optional ml group; neither ships complete type information
